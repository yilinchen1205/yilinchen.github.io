{% include base_path %}

<li class="talk-cv-item">

  <div class="talk-cv-title">
    {{ post.title }}
  </div>


  <div class="talk-cv-meta">

    {% if post.type %}
      {{ post.type }}
    {% endif %}


    {% if post.venue %}
      · {{ post.venue }}
    {% endif %}


    {% if post.date %}
      · {{ post.date | date: "%b %Y" }}
    {% endif %}

  </div>

</li>
